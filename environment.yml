# Environment for the MSN model (NEST + NESTML).
# Create:  conda env create -f environment.yml
# Update:  conda env update -n env_nest -f environment.yml --prune
name: env_nest
channels:
  - conda-forge
dependencies:
  - python=3.11
  - nest-simulator=3.8
  - cxx-compiler        # required by NESTML to build the C++ module
  - cmake
  - libboost-headers
  - numpy
  - scipy
  - pip
  - pip:
      - nestml==9.0.1
      - matplotlib
      - ipykernel
      - jupyter
